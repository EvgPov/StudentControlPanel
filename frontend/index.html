<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Control Panel</title>
  <script defer type="module" src="./src/main.js"></script>
  <link rel="stylesheet" href="./style/normolize.css">
  <link rel="stylesheet" href="./style/style.css">
</head>
<body class="body">
  <main class="main">
    <h1 class="main__title">Students Control Panel</h1>
    <section class="main__filter"> 
      <h2 class="main__filter-title">Filters</h2>
    </section>
    <section class="main__table">
      <table data-component="students-table" class="main__table-table">
        <thead data-role="table-header">
          <tr>
            <th data-field="id">№</th>
            <th data-field="name">ФИО</th>
            <th data-field="faculty">ФАКУЛЬТЕТ</th>
            <th data-field="birthday_age">ДАТА РОЖДЕНИЯ (ВОЗРАСТ)</th>
            <th data-field="studyYears_courseNumber">ГОДЫ ОБУЧЕНИЯ (НОМЕР КУРСА)</th>
            <th data-field="delete"></th>
          </tr>
        </thead>
        <tbody data-role="table-body"></tbody>
      </table>
    </section>
    <section class="main__add">
      <h2 class="main__add-title">Add a student</h2>
      <form class="main__add-form" id="add-form" name="form">
            <label for="studentname" class="label">Имя
              <input
              type="text"
              id="studentname"
              class="main__add-form__name form__item"
              name="studentname"
              placeholder="input students`s name ..."
              minlength="2"
              maxlength="200"
              required
              />
            </label>  
           <label for="surename" class="label">Отчество
              <input
              type="text"
              name="surename"
              class="main__add-form__surename form__item"
              name="surename"
              placeholder="input students`s surename ..."
              minlength="2"
              maxlength="200"
              required
              />
            </label>
          <label for="lastname" class="label">Фамилия
            <input
              type="text"
              id="lastname"
              class="main__add-form__lastname form__item"
              name="lastname"
              placeholder="input students`s lastname ..."
              minlength="2"
              maxlength="200"
              required
            />
          </label>  
          <label for="birthday" class="">День рождения
            <input
              type="date"
              id="birthday"
              class="main__add-form__birthday form__item"
              name="birthday"
              placeholder="input students`s birthday ..."
              minlength="2"
              maxlength="200"
              required
            />
          </label> 
          <label for="studyStart" class="">Год начала обучения
            <select data-component="select-studyStart" data-style="style" id="studyStart" class="form__item dynamic-select" name="studyStart"></select>
           </label> 
          <label for="faculty" class="">Факультет
            <select data-component="select-faculty" data-style="style" id="faculty" class="form__item dynamic-select" name="faculty"></select>
          </label>
          <button type="submit" class="btn main__add-form__submit">Add</button>
      </form>
    </section>
  </main>
</body>
</html>
