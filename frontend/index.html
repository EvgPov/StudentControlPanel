<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Control Panel</title>
  <script defer type="module" src="./src/main.js"></script>
  <link rel="stylesheet" href="./style/normolize.css">
  <link rel="stylesheet" href="./style/style.scc">
</head>
<body class="body">
  <main class="main">
    <h1 class="main__title">Student Control Panel</h1>
    <section class="main__filter"> 
      <h2 class="main__filter-title">Filters</h2>
    </section>
    <section class="main__table">
      <h2 class="main__table-title">Table</h2>
      <table data-component="students-table" class="main__table-table">
        <thead data-role="table-header">
          <tr>
            <th data-field="id">№</th>
            <th data-field="name">ИМЯ</th>
            <th data-field="surname">ОТЧЕСТВО</th>
            <th data-field="lastname">ФАМИЛИЯ</th>
            <th data-field="birthday">ДАТА РОЖДЕНИЯ</th>
            <th data-field="studyStart">ГОД НАЧАЛА ОБУЧЕНИЯ</th>
            <th data-field="faculty">ФАКУЛЬТЕТ</th>
            <th data-field="delete"></th>
          </tr>
        </thead>
        <tbody data-role="table-body"></tbody>
      </table>
    </section>
    <section class="main__add-form">
      <h2 class="main__add-form-title">Add form</h2>
      <form class="main__add-form-form">
      </form>
    </section>
  </main>
</body>
</html>
